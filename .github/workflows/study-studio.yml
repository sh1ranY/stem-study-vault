name: Study Studio checks
on:
  pull_request:
    paths: ['apps/study-studio/**', 'render.yaml', '.github/workflows/study-studio.yml']
  push:
    branches: [main]
    paths: ['apps/study-studio/**', 'render.yaml', '.github/workflows/study-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: apps/study-studio
    env:
      OPENAI_API_KEY: ''
      STUDIO_VISION_MODEL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/study-studio/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/study-studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/study-studio/package-lock.json
      - run: npm ci
      - run: npm run test:images
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t studio-pilot apps/study-studio
      - name: Start isolated hosted-mode smoke test
        run: |
          docker run -d --name studio-test -v studio-data:/var/data -p 8765:8765 -e STUDIO_DEPLOYMENT=hosted -e STUDIO_PUBLIC_ORIGIN=https://study.example.test -e STUDIO_BOOTSTRAP_TOKEN=synthetic-ci-bootstrap-32-characters studio-pilot
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8765/api/health; then exit 0; fi
            sleep 2
          done
          docker logs studio-test
          exit 1
      - name: Verify bootstrap protection and persistence across restart
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Uninvited","password":"synthetic-password"}' http://localhost:8765/api/pilot/auth/register)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Owner","password":"synthetic-password","bootstrap_token":"synthetic-ci-bootstrap-32-characters"}' http://localhost:8765/api/pilot/auth/register)" = 200
          docker rm -f studio-test
          docker run -d --name studio-test -v studio-data:/var/data -p 8765:8765 -e STUDIO_DEPLOYMENT=hosted -e STUDIO_PUBLIC_ORIGIN=https://study.example.test -e STUDIO_BOOTSTRAP_TOKEN=synthetic-ci-bootstrap-32-characters studio-pilot
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8765/api/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8765/api/pilot/status | python3 -c 'import sys,json; s=json.load(sys.stdin); assert s["course_ready"] and not s["setup_required"] and s["deployment"]=="hosted-invitation"'
      - if: always()
        run: |
          docker rm -f studio-test || true
          docker volume rm studio-data || true
