<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="title desc"><title id="title">Equal slopes, different heights</title><desc id="desc">r(t) and r(t-2) have equal slopes after time two. Their difference rises to two and stays two.</desc><rect width="680" height="350" fill="#f5f7ef"/><g font-family="sans-serif" font-size="14" fill="#53664e"><text x="35" y="30">Equal slopes, different heights</text><path d="M50 260 H630 M110 275 V55" fill="none" stroke="#aab7a0"/><path d="M50 260 H110 L610 60" stroke="#a6b29b" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M50 260 H310 L610 140" stroke="#c29559" stroke-width="3" stroke-dasharray="7 5" fill="none"/><path d="M50 260 H110 L310 180 H610" stroke="#246c55" stroke-width="4" fill="none"/><text x="100" y="290">0</text><text x="303" y="290">2</text><text x="600" y="290">5</text><text x="635" y="267">t</text><text x="87" y="185">2</text><text x="475" y="174" fill="#246c55">difference = 2</text><text x="68" y="327" fill="#7c8a72">— — r(t)</text><text x="225" y="327" fill="#ac8048">— — r(t − 2)</text><text x="430" y="327" fill="#246c55">━━ r(t) − r(t − 2)</text></g></svg>
